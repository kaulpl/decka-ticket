name: Test and publish WordPress update
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decka-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, gd, zip, openssl
      - run: python3 tests/release-version.py
      - name: Assign release version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/release-version.py
      - run: pnpm --dir frontend --ignore-workspace install --frozen-lockfile
      - run: pnpm --dir frontend run build
      - run: php -l plugin/decka-bilety.php
      - run: find plugin/includes -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/domain.php && php tests/payu.php && php tests/updater.php && php tests/identity-wallet.php && php tests/db-diagnostics.php && php tests/stripe-health.php
      - run: node scripts/licenses.mjs
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: decka-bilety
          path: dist/
  mysql:
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8.0
            health: mysqladmin ping -h localhost -pdecka-ci-only
          - database: mariadb
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
    name: Database (${{ matrix.database }})
    runs-on: ubuntu-latest
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: decka-ci-only
          MYSQL_DATABASE: decka_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, gd, zip, openssl
          tools: wp-cli
      - name: Ensure WordPress CLI is available
        run: |
          if ! command -v wp >/dev/null 2>&1; then
            curl --fail --location --retry 3 --retry-all-errors https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/decka-wp-cli
            php /tmp/decka-wp-cli --info
            sudo install -m 755 /tmp/decka-wp-cli /usr/local/bin/wp
          fi
          wp --info
      - name: Test checkout with real WordPress and strict MySQL
        env:
          DECKA_CI_MYSQL: '1'
        run: |
          mkdir -p /tmp/decka-wp
          wp core download --path=/tmp/decka-wp
          wp config create --path=/tmp/decka-wp --dbname=decka_test --dbuser=root --dbpass=decka-ci-only --dbhost=127.0.0.1:3306
          wp core install --path=/tmp/decka-wp --url=http://example.test --title=Decka-CI --admin_user=admin --admin_password=ci-only-password --admin_email=admin@example.test --skip-email
          wp config set DISABLE_WP_CRON true --raw --path=/tmp/decka-wp
          ln -s "$GITHUB_WORKSPACE/plugin" /tmp/decka-wp/wp-content/plugins/decka-bilety
          wp plugin activate decka-bilety --path=/tmp/decka-wp
          wp eval-file "$GITHUB_WORKSPACE/tests/mysql-checkout.php" --path=/tmp/decka-wp
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, mysql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decka-bilety
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("dist/decka-bilety-update.json"))["version"])')
          TAG="v$VERSION"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/decka-draft; then
            if [ "$(cat /tmp/decka-draft)" = "false" ]; then
              echo "Release $TAG already published; preserving immutable assets."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$RELEASE_COMMIT" --draft --title "Decka Bilety $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip dist/decka-bilety-update.json dist/SHA256.json --clobber
          gh release edit "$TAG" --draft=false --latest
